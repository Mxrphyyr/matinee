[package]
name = "matinee"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "A private, ad-free GTK client for following YouTube channels"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
ureq = "3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = "thin"
strip = true
